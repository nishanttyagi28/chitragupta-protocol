services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Unauthenticated local-only mode -- see docs/deployment.md.
      # Remove this and set CHITRAGUPTA_API_TOKEN before exposing this
      # beyond your own machine.
      CHITRAGUPTA_API_DEV_MODE: "1"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
