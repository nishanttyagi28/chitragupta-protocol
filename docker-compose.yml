services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Unauthenticated local-only mode -- see docs/deployment.md.
      # Remove this and set CHITRAGUPTA_API_TOKEN before exposing this
      # beyond your own machine.
      CHITRAGUPTA_API_DEV_MODE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy

  # Local dry run of the same public-demo configuration used in
  # render.yaml -- `docker compose --profile demo up demo` -- useful for
  # verifying the sandbox before deploying it. Does not require Redis.
  demo:
    build: .
    profiles: ["demo"]
    ports:
      - "8001:8000"
    environment:
      CHITRAGUPTA_PUBLIC_DEMO: "1"
      CHITRAGUPTA_DEMO_TTL_SECONDS: "900"
      CHITRAGUPTA_DEMO_RATE_LIMIT_PER_MINUTE: "30"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
