name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff format --check .
      - run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[all]" mypy
      - run: mypy src

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[all]"
      - run: pip install pytest pytest-asyncio pytest-cov hypothesis freezegun
      - run: pytest -v
        env:
          REDIS_URL: redis://localhost:6379/0

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[all]"
      - run: pip install pytest pytest-asyncio pytest-cov hypothesis freezegun
      - run: pytest --cov=karmasakshi --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install-smoke-test:
    name: Install wheel + demo smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: pip install dist/*.whl
      - run: python -c "import karmasakshi; print(karmasakshi.__version__)"
      - run: karmasakshi version
      - run: karmasakshi --help
      - run: karmasakshi-acceptance --help
      - run: karmasakshi doctor || true  # workspace not initialized yet; exercises the command path
      - run: karmasakshi demo --all

  compose-acceptance:
    name: Docker Compose buyer acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose --profile acceptance config --quiet
      - name: Build and run the real buyer journey
        run: |
          docker compose up --detach --build --wait api
          docker compose --profile acceptance run --rm acceptance
      - name: Export acceptance report
        if: always()
        run: |
          mkdir -p artifacts
          docker compose --profile acceptance run --rm --no-deps \
            --entrypoint cat acceptance \
            /data/acceptance/milestone-a.json \
            > artifacts/milestone-a-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milestone-a-acceptance
          path: artifacts/milestone-a-acceptance.json
          if-no-files-found: warn
      - name: Tear down evaluation environment
        if: always()
        run: docker compose --profile acceptance down --volumes

  docs-check:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify required documentation files exist
        run: |
          set -e
          for f in README.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md CHANGELOG.md LICENSE \
                   docs/architecture.md docs/protocol-spec.md docs/effect-manifest.md \
                   docs/execution-grants.md docs/delegation.md docs/state-machine.md \
                   docs/threat-model.md docs/security-model.md docs/storage-semantics.md \
                   docs/crash-recovery.md docs/adapter-authoring.md docs/langgraph-integration.md \
                   docs/agenteval-integration.md docs/action-passports.md docs/api.md docs/cli.md \
                   docs/deployment.md docs/limitations.md docs/comparison.md \
                   docs/control-center.md docs/gateway.md docs/sdk.md \
                   docs/product/BUYER_EVALUATION.md docs/product/MVP_ACCEPTANCE.md; do
            if [ ! -f "$f" ]; then echo "Missing required doc: $f"; exit 1; fi
          done
          echo "All required documentation files present."
